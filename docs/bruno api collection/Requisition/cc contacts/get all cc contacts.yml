info:
  name: get all cc contacts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cc-contacts"
  headers:
    - name: Authorization
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
