info:
  name: update a cc contact (SUPER_ADMIN)
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/cc-contacts/1"
  headers:
    - name: Authorization
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "designation": "Operations Director"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
