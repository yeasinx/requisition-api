info:
  name: post a user
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Authorization
      value: "{{token}}"
  body:
    type: form-urlencoded
    data:
      - name: name
        value: Yeasin Arafat
      - name: email
        value: yeasin@company.com
      - name: password
        value: password123
      - name: employee_id
        value: EMP-1021
      - name: designation
        value: Jr Software Engineer
      - name: role
        value: EMPLOYEE
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
