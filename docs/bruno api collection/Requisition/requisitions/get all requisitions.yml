info:
  name: get all requisitions
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/requisitions"
  headers:
    - name: Authorization
      value: "{{token}}"
  params:
    - name: approval
      value: pending
      type: query
      disabled: true
    - name: submitted
      value: mine
      type: query
      disabled: true
    - name: trashed
      value: only
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
