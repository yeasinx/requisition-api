info:
  name: get all user roles
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/settings"
  headers:
    - name: Authorization
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
