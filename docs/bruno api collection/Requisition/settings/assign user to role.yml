info:
  name: assign user to role
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/settings"
  headers:
    - name: Authorization
      value: "{{token}}"
  body:
    type: multipart-form
    data:
      - name: hr_admin_approver_user_id
        type: text
        value: "3"
      - name: first_approver_user_id
        type: text
        value: "4"
      - name: second_approver_user_id
        type: text
        value: "5"
      - name: business_controller_user_id
        type: text
        value: "6"
      - name: accounts_approver_user_id
        type: text
        value: "2"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
