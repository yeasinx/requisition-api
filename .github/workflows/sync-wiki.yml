name: Sync to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Sync docs/wiki to Wiki Repository
        env:
          WIKI_PAT: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          # 1. Clone the wiki repository
          git clone "https://x-access-token:${WIKI_PAT}@github.com/${{ github.repository }}.wiki.git" wiki-target

          # 2. Sync files into wiki root (rsync removes files deleted in docs/wiki)
          rsync -av --delete --exclude='.git' docs/wiki/ wiki-target/

          # 3. Commit and push changes if any exist
          cd wiki-target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Sync wiki from docs/wiki [skip ci]"
            git push
          else
            echo "No changes to sync."
          fi
